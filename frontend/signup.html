<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <style>
      @keyframes myAnimation {
        from {
          background-color: blue;
        }
        to {
          background-color: rgb(66, 66, 211);
        }
      }
      body {
        background-color: blue;
        animation: myAnimation 3s linear infinite;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .signup {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
      }
      .signup-form {
        width: 300px;
        border: 5px solid black;
        padding: 50px;
        margin: 20px;
        border-radius: 15px;
        gap: 10px;
        text-align: center;
      }
      h1 {
        color: white;
        text-align: center;
        align-items: center;
      }
      .text_fields {
        height: 25px;
        width: 300px;
        margin: 10px;
        border-radius: 15px;
      }
      button {
        height: 45px;
        width: 80px;
        background-color: yellow;
        color: black;
        font-size: medium;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <form action="" ,method="post">
      <div class="signup">
        <div class="signup-form">
          <h1>SignupForm</h1>
          <input class="text_fields" type="text" placeholder="Enter name" />
          <input class="text_fields" type="text" placeholder="Enter username" />
          <input class="text_fields" type="text" placeholder="Enter Password" />
          <input
            class="text_fields"
            type="text"
            placeholder="Confirm Password"
          /><br />
          <button>Signup</button>
        </div>
      </div>
    </form>
  </body>
</html>
